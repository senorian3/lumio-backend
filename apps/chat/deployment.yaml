apiVersion: apps/v1
kind: Deployment
metadata:
  name: DEPLOYMENT_NAME
  namespace: NAMESPACE
  labels:
    app: PROJECT
spec:
  selector:
    matchLabels:
      project: PROJECT
  template:
    metadata:
      namespace: NAMESPACE
      labels:
        project: PROJECT
    spec:
      containers:
        - name: PROJECT
          image: REGISTRY_HOSTNAME/PROJECT:TAG_VERSION
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true # опционально, но хорошая практика
            runAsUser: 1000 # опционально
          ports:
            - containerPort: PORT_CONTAINER
          env:
            - name: PORT
              valueFrom:
                secretKeyRef:
                  name: lumio-back-end-chat-production-config-secret
                  key: PORT
            - name: INTERNAL_API_KEY
              valueFrom:
                secretKeyRef:
                  name: lumio-back-end-chat-production-config-secret
                  key: INTERNAL_API_KEY
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: lumio-back-end-chat-production-config-secret
                  key: DATABASE_URL
            - name: IS_SWAGGER_ENABLED
              valueFrom:
                secretKeyRef:
                  name: lumio-back-end-chat-production-config-secret
                  key: IS_SWAGGER_ENABLED
            - name: INCLUDE_TESTING_MODULE
              valueFrom:
                secretKeyRef:
                  name: lumio-back-end-chat-production-config-secret
                  key: INCLUDE_TESTING_MODULE
            - name: RABBITMQ_URL
              valueFrom:
                secretKeyRef:
                  name: lumio-back-end-chat-production-config-secret
                  key: RABBITMQ_URL
            - name: RABBITMQ_QUEUE
              valueFrom:
                secretKeyRef:
                  name: lumio-back-end-chat-production-config-secret
                  key: RABBITMQ_QUEUE
            - name: FRONTEND_URL
              valueFrom:
                secretKeyRef:
                  name: lumio-back-end-chat-production-config-secret
                  key: FRONTEND_URL
            - name: FILES_SERVICE_URL
              valueFrom:
                secretKeyRef:
                  name: lumio-back-end-chat-production-config-secret
                  key: FILES_SERVICE_URL
            - name: JWT_ACCESS_TOKEN_SECRET
              valueFrom:
                secretKeyRef:
                  name: lumio-back-end-chat-production-config-secret
                  key: JWT_ACCESS_TOKEN_SECRET
            - name: JWT_ACCESS_TOKEN_EXPIRATION_MINUTES
              valueFrom:
                secretKeyRef:
                  name: lumio-back-end-chat-production-config-secret
                  key: JWT_ACCESS_TOKEN_EXPIRATION_MINUTES
            - name: NODE_ENV
              valueFrom:
                secretKeyRef:
                  name: lumio-back-end-chat-production-config-secret
                  key: NODE_ENV
