services:
  postgres:
    image: postgres:15
    container_name: lumio_super_admin_postgres
    environment:
      POSTGRES_DB: super_admin
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - '5435:5432'
    volumes:
      - postgres_data_super_admin:/var/lib/postgresql/data

volumes:
  postgres_data_super_admin:
