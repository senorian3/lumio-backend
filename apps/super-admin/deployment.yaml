apiVersion: apps/v1
kind: Deployment
metadata:
  name: DEPLOYMENT_NAME
  namespace: NAMESPACE
  labels:
    app: PROJECT
spec:
  selector:
    matchLabels:
      project: PROJECT
  template:
    metadata:
      namespace: NAMESPACE
      labels:
        project: PROJECT
    spec:
      containers:
        - name: PROJECT
          image: REGISTRY_HOSTNAME/PROJECT:TAG_VERSION
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true # опционально, но хорошая практика
            runAsUser: 1000 # опционально
          ports:
            - containerPort: PORT_CONTAINER
          env:
            - name: PORT
              valueFrom:
                secretKeyRef:
                  name: lumio-back-end-sa-production-config-secret
                  key: PORT
            - name: INTERNAL_API_KEY
              valueFrom:
                secretKeyRef:
                  name: lumio-back-end-sa-production-config-secret
                  key: INTERNAL_API_KEY
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: lumio-back-end-sa-production-config-secret
                  key: DATABASE_URL
            - name: IS_GRAPHQL_PLAYGROUND_ENABLED
              valueFrom:
                secretKeyRef:
                  name: lumio-back-end-sa-production-config-secret
                  key: IS_GRAPHQL_PLAYGROUND_ENABLED
            - name: NODE_ENV
              valueFrom:
                secretKeyRef:
                  name: lumio-back-end-sa-production-config-secret
                  key: NODE_ENV
