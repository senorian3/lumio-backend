apiVersion: apps/v1
kind: Deployment
metadata:
  name: DEPLOYMENT_NAME
  namespace: NAMESPACE
  labels:
    app: PROJECT
spec:
  selector:
    matchLabels:
      project: PROJECT
  template:
    metadata:
      namespace: NAMESPACE
      labels:
        project: PROJECT
    spec:
      containers:
        - name: PROJECT
          image: REGISTRY_HOSTNAME/PROJECT:TAG_VERSION
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true # опционально, но хорошая практика
            runAsUser: 1000 # опционально
          ports:
            - containerPort: PORT_CONTAINER
          env:
            - name: PORT
              valueFrom:
                secretKeyRef:
                  name: lumio-back-end-sa-production-config-secret
                  key: PORT
            - name: INTERNAL_API_KEY
              valueFrom:
                secretKeyRef:
                  name: lumio-back-end-sa-production-config-secret
                  key: INTERNAL_API_KEY
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: lumio-back-end-sa-production-config-secret
                  key: DATABASE_URL
            - name: IS_GRAPHQL_PLAYGROUND_ENABLED
              valueFrom:
                secretKeyRef:
                  name: lumio-back-end-sa-production-config-secret
                  key: IS_GRAPHQL_PLAYGROUND_ENABLED
            - name: LUMIO_SERVICE_URL
              valueFrom:
                secretKeyRef:
                  name: lumio-back-end-sa-production-config-secret
                  key: LUMIO_SERVICE_URL
            - name: FILES_SERVICE_URL
              valueFrom:
                secretKeyRef:
                  name: lumio-back-end-sa-production-config-secret
                  key: FILES_SERVICE_URL
            - name: PAYMENTS_SERVICE_URL
              valueFrom:
                secretKeyRef:
                  name: lumio-back-end-sa-production-config-secret
                  key: PAYMENTS_SERVICE_URL
            - name: RMQ_URL
              valueFrom:
                secretKeyRef:
                  name: lumio-back-end-sa-production-config-secret
                  key: RMQ_URL
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: lumio-back-end-sa-production-config-secret
                  key: JWT_SECRET
            - name: JWT_EXPIRATION
              valueFrom:
                secretKeyRef:
                  name: lumio-back-end-sa-production-config-secret
                  key: JWT_EXPIRATION
            - name: SUPER_ADMIN_SECRET
              valueFrom:
                secretKeyRef:
                  name: lumio-back-end-sa-production-config-secret
                  key: SUPER_ADMIN_SECRET
            - name: SUPER_ADMIN_EMAIL
              valueFrom:
                secretKeyRef:
                  name: lumio-back-end-sa-production-config-secret
                  key: SUPER_ADMIN_EMAIL
            - name: SUPER_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: lumio-back-end-sa-production-config-secret
                  key: SUPER_ADMIN_PASSWORD
            - name: SUPER_ADMIN_TOKEN_EXPIRATION_MINUTES
              valueFrom:
                secretKeyRef:
                  name: lumio-back-end-sa-production-config-secret
                  key: SUPER_ADMIN_TOKEN_EXPIRATION_MINUTES
            - name: NODE_ENV
              valueFrom:
                secretKeyRef:
                  name: lumio-back-end-sa-production-config-secret
                  key: NODE_ENV
